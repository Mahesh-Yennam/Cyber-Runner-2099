<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="cyberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <filter id="cyberGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="64" height="64" rx="14" fill="#050711"/>
  <rect x="2" y="2" width="60" height="60" rx="12" stroke="url(#cyberGrad)" stroke-width="2" stroke-opacity="0.5"/>
  <!-- Cyber Helmet Mask -->
  <path d="M18 20C18 16 22 14 32 14C42 14 46 16 46 20V38L32 50L18 38V20Z" fill="#0f172a" stroke="#6366f1" stroke-width="2"/>
  <!-- Glowing Horizontal Visor Beam -->
  <rect x="20" y="26" width="24" height="6" rx="2" fill="#06b6d4" filter="url(#cyberGlow)"/>
  <!-- Diagonal Energy Katana Slash -->
  <line x1="12" y1="52" x2="52" y2="12" stroke="#f43f5e" stroke-width="2.5" stroke-linecap="round" filter="url(#cyberGlow)"/>
</svg>
